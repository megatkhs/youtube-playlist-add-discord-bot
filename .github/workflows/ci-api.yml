name: CI (API)

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'bun.lockb'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Wrangler types
        run: bun run types
        working-directory: apps/api

      - name: Run API tests
        run: bun run --filter @yt-playlist-bot/api test
