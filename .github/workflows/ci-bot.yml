name: CI (Bot)

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'apps/bot/**'
      - 'package.json'
      - 'bun.lockb'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bot tests
        run: bun run --filter @yt-playlist-bot/bot test
